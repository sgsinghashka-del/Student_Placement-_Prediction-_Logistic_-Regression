<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Student Placement Prediction dashboard preview</title>
  <desc id="desc">A generated preview of the Streamlit student placement prediction interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #64748b; }
      .label { fill: #334155; font-size: 18px; font-weight: 600; }
      .value { fill: #0f172a; font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
  <rect x="0" y="0" width="1440" height="82" fill="#ffffff"/>
  <circle cx="82" cy="41" r="24" fill="#dbeafe"/>
  <text x="68" y="49" class="sans" font-size="25">🎓</text>
  <text x="124" y="49" class="sans" font-size="24" font-weight="800" fill="#0f172a">Student Placement Predictor</text>
  <text x="1220" y="49" class="sans" font-size="16" font-weight="600" fill="#64748b">MODEL v1</text>
  <rect x="60" y="126" width="1320" height="164" rx="24" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="104" y="190" class="sans" font-size="38" font-weight="800" fill="#ffffff">Student Placement Prediction</text>
  <text x="104" y="235" class="sans" font-size="21" fill="#dbeafe">Estimate placement probability from academic and interview readiness signals.</text>
  <rect x="1112" y="176" width="210" height="58" rx="29" fill="#ffffff" fill-opacity=".16"/>
  <circle cx="1144" cy="205" r="9" fill="#86efac"/>
  <text x="1166" y="213" class="sans" font-size="17" font-weight="700" fill="#ffffff">API connected</text>
  <rect x="60" y="330" width="800" height="486" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="102" y="382" class="sans" font-size="25" font-weight="800" fill="#0f172a">Student profile</text>
  <text x="102" y="414" class="sans muted" font-size="17">Enter the candidate's details to generate a prediction.</text>
  <text x="102" y="470" class="sans label">CGPA</text>
  <rect x="102" y="488" width="335" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="122" y="522" class="sans value">8.2</text>
  <text x="480" y="470" class="sans label">Aptitude Score</text>
  <rect x="480" y="488" width="335" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="522" class="sans value">78</text>
  <text x="102" y="580" class="sans label">Technical Projects</text>
  <rect x="102" y="598" width="335" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="122" y="632" class="sans value">3</text>
  <text x="480" y="580" class="sans label">Internships</text>
  <rect x="480" y="598" width="335" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="632" class="sans value">1</text>
  <text x="102" y="690" class="sans label">Mock Interview Score</text>
  <rect x="102" y="708" width="713" height="8" rx="4" fill="#dbeafe"/>
  <rect x="102" y="708" width="492" height="8" rx="4" fill="#2563eb"/>
  <circle cx="594" cy="712" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <text x="760" y="690" class="sans value">75</text>
  <rect x="924" y="330" width="456" height="486" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="966" y="382" class="sans" font-size="25" font-weight="800" fill="#0f172a">Prediction result</text>
  <text x="966" y="414" class="sans muted" font-size="17">Powered by Logistic Regression</text>
  <circle cx="1152" cy="555" r="128" fill="#eff6ff" stroke="#bfdbfe" stroke-width="14"/>
  <path d="M1152 427 A128 128 0 1 1 1050 632" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <text x="1152" y="566" text-anchor="middle" class="sans" font-size="48" font-weight="800" fill="#1d4ed8">72%</text>
  <text x="1152" y="599" text-anchor="middle" class="sans" font-size="16" fill="#64748b">placement probability</text>
  <rect x="988" y="687" width="328" height="58" rx="12" fill="#dcfce7"/>
  <text x="1152" y="724" text-anchor="middle" class="sans" font-size="19" font-weight="800" fill="#166534">✓ Likely to be placed</text>
  <text x="1152" y="778" text-anchor="middle" class="sans" font-size="14" fill="#94a3b8">Threshold: 0.60  •  Model: v1</text>
</svg>
