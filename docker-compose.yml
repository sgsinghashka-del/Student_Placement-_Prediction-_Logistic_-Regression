services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PREDICTION_THRESHOLD: ${PREDICTION_THRESHOLD:-0.6}
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000/predict
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  api_logs:
